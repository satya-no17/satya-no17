<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-label="satya-no17 terminal boot sequence">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="glowGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12161e"/>
      <stop offset="100%" stop-color="#0c1018"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.2"/>
    </pattern>
    <clipPath id="screenClip">
      <rect x="18" y="52" width="884" height="450" rx="6"/>
    </clipPath>
    <clipPath id="c1"><rect class="reveal r1" x="36" y="70" width="0" height="24"/></clipPath>
    <clipPath id="c2"><rect class="reveal r2" x="36" y="98" width="0" height="24"/></clipPath>
    <clipPath id="c3"><rect class="reveal r3" x="36" y="126" width="0" height="24"/></clipPath>
    <clipPath id="c4"><rect class="reveal r4" x="36" y="154" width="0" height="24"/></clipPath>
    <clipPath id="c5"><rect class="reveal r5" x="36" y="182" width="0" height="24"/></clipPath>
    <clipPath id="c6"><rect class="reveal r6" x="36" y="210" width="0" height="24"/></clipPath>
    <clipPath id="c7"><rect class="reveal r7" x="36" y="238" width="0" height="24"/></clipPath>
    <clipPath id="c8"><rect class="reveal r8" x="36" y="266" width="0" height="24"/></clipPath>
    <style><![CDATA[
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes scanSweep {
        0% { transform: translateY(-520px); }
        100% { transform: translateY(520px); }
      }
      @keyframes flicker {
        0%, 100% { opacity: 1; }
        93% { opacity: 0.88; }
        94% { opacity: 1; }
        96% { opacity: 0.92; }
        97% { opacity: 1; }
      }
      @keyframes glitch {
        0%, 90%, 100% { transform: translate(0, 0); }
        91% { transform: translate(-3px, 1px); }
        92% { transform: translate(3px, -1px); }
        93% { transform: translate(-2px, 0); }
        94% { transform: translate(2px, 1px); }
      }
      @keyframes revealW {
        from { width: 0; }
        to { width: 860px; }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @keyframes matrixFall {
        0% { transform: translateY(-40px); opacity: 0; }
        12% { opacity: 0.3; }
        88% { opacity: 0.15; }
        100% { transform: translateY(480px); opacity: 0; }
      }
      @keyframes bootBar {
        from { width: 0; }
        to { width: 260px; }
      }
      @keyframes caretPulse {
        0%, 100% { fill: #39ff14; }
        50% { fill: #9dff8a; }
      }
      .screen { animation: flicker 4.2s infinite; }
      .scan-beam { animation: scanSweep 3.8s linear infinite; }
      .title-glitch {
        animation: glitch 5s infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .r1 { animation: revealW 1.05s steps(40, end) 0.25s both; }
      .r2 { animation: revealW 0.85s steps(34, end) 1.4s both; }
      .r3 { animation: revealW 1.1s steps(44, end) 2.35s both; }
      .r4 { animation: revealW 1.15s steps(46, end) 3.55s both; }
      .r5 { animation: revealW 1.05s steps(42, end) 4.8s both; }
      .r6 { animation: revealW 0.75s steps(30, end) 5.95s both; }
      .r7 { animation: revealW 0.95s steps(38, end) 6.85s both; }
      .r8 { animation: revealW 0.7s steps(28, end) 7.95s both; }
      .block { opacity: 0; animation: fadeUp 0.45s ease-out forwards; }
      .b1 { animation-delay: 9.0s; }
      .b2 { animation-delay: 9.35s; }
      .b3 { animation-delay: 9.7s; }
      .b4 { animation-delay: 10.05s; }
      .ascii { opacity: 0; animation: fadeUp 0.6s ease-out 8.5s forwards; }
      .footer { opacity: 0; animation: fadeUp 0.5s ease-out 10.4s forwards; }
      .cursor { animation: blink 1.05s step-end infinite; }
      .status-dot { animation: pulseDot 1.6s ease-in-out infinite; }
      .m1 { animation: matrixFall 7s linear 0s infinite; }
      .m2 { animation: matrixFall 8.5s linear 1.2s infinite; }
      .m3 { animation: matrixFall 6.2s linear 2.4s infinite; }
      .m4 { animation: matrixFall 9s linear 0.8s infinite; }
      .m5 { animation: matrixFall 7.8s linear 3.1s infinite; }
      .loadbar { animation: bootBar 2.0s ease-out 8.9s both; }
      .prompt-caret { animation: caretPulse 1.2s ease-in-out infinite; }
      text, tspan {
        font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
      }
    ]]></style>
  </defs>

  <rect width="920" height="520" rx="14" fill="#06080c" stroke="#1c2430" stroke-width="2"/>
  <rect x="8" y="8" width="904" height="504" rx="10" fill="url(#bgGrad)" stroke="#15202b" stroke-width="1"/>

  <rect x="8" y="8" width="904" height="40" rx="10" fill="url(#barGrad)"/>
  <rect x="8" y="38" width="904" height="10" fill="url(#barGrad)"/>
  <circle cx="32" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="28" r="6" fill="#27c93f" class="status-dot"/>
  <text x="460" y="33" text-anchor="middle" fill="#6b7a8d" font-size="13" letter-spacing="1.5">satya@no17 — zsh — 120×40</text>

  <g class="screen" clip-path="url(#screenClip)">
    <g fill="#39ff14" font-size="11" opacity="0.2" filter="url(#neon)">
      <text class="m1" x="60" y="40">01001101</text>
      <text class="m2" x="210" y="20">SATYA</text>
      <text class="m3" x="390" y="50">???</text>
      <text class="m4" x="560" y="30">0x17</text>
      <text class="m5" x="760" y="45">BUILD</text>
    </g>

    <rect x="18" y="52" width="884" height="140" fill="url(#glowGreen)"/>

    <text clip-path="url(#c1)" x="36" y="88" fill="#39ff14" font-size="14">$ boot --profile satya-no17 --mode dark --fx crazy</text>
    <text clip-path="url(#c2)" x="36" y="116" fill="#8b949e" font-size="14">? kernel: imagination.sys loaded</text>
    <text clip-path="url(#c3)" x="36" y="144" fill="#58a6ff" font-size="14">? mounting /dev/coffee … ok</text>
    <text clip-path="url(#c4)" x="36" y="172" fill="#ffa657" font-size="14">? syncing skills: JS · TS · React · Node · Python · C++</text>
    <text clip-path="url(#c5)" x="36" y="200" fill="#7ee787" font-size="14">? spawning agents: builder · debugger · pixel-pusher</text>
    <text clip-path="url(#c6)" x="36" y="228" fill="#ff7b72" font-size="14">? firewall: vibe-check PASSED</text>
    <text clip-path="url(#c7)" x="36" y="256" fill="#79c0ff" font-size="14">? status: shipping cool stuff in the dark</text>
    <text clip-path="url(#c8)" x="36" y="284" fill="#39ff14" font-size="14">$ whoami</text>

    <g class="ascii title-glitch" transform="translate(36, 300)" filter="url(#softGlow)">
      <text fill="#39ff14" font-size="14" letter-spacing="0.5">
        <tspan x="0" dy="0">???????? ?????? ????????????   ??? ??????</tspan>
        <tspan x="0" dy="16">????????????????????????????? ????????????</tspan>
        <tspan x="0" dy="16">????????????????   ???    ??????? ????????</tspan>
        <tspan x="0" dy="16">????????????????   ???     ?????  ????????</tspan>
        <tspan x="0" dy="16">???????????  ???   ???      ???   ???  ???</tspan>
        <tspan x="0" dy="16">???????????  ???   ???      ???   ???  ???</tspan>
      </text>
    </g>

    <g transform="translate(520, 300)" font-size="13">
      <g class="block b1">
        <rect x="0" y="0" width="340" height="28" rx="4" fill="#0d1520" stroke="#1f2a37"/>
        <text x="12" y="19" fill="#8b949e">user</text>
        <text x="70" y="19" fill="#39ff14">satyam kumar // satya-no17</text>
      </g>
      <g class="block b2">
        <rect x="0" y="36" width="340" height="28" rx="4" fill="#0d1520" stroke="#1f2a37"/>
        <text x="12" y="55" fill="#8b949e">role</text>
        <text x="70" y="55" fill="#58a6ff">full-stack · hackathon builder</text>
      </g>
      <g class="block b3">
        <rect x="0" y="72" width="340" height="28" rx="4" fill="#0d1520" stroke="#1f2a37"/>
        <text x="12" y="91" fill="#8b949e">stack</text>
        <text x="70" y="91" fill="#ffa657">Next · Express · Mongo · Redis</text>
      </g>
      <g class="block b4">
        <rect x="0" y="108" width="340" height="28" rx="4" fill="#0d1520" stroke="#1f2a37"/>
        <text x="12" y="127" fill="#8b949e">mode</text>
        <text x="70" y="127" fill="#7ee787">DARK ???????????? ONLINE</text>
      </g>
    </g>

    <g class="footer" transform="translate(36, 455)">
      <text fill="#6b7a8d" font-size="12">loading profile UI</text>
      <rect x="160" y="2" width="260" height="10" rx="3" fill="#121820" stroke="#243041"/>
      <rect class="loadbar" x="160" y="2" width="0" height="10" rx="3" fill="#39ff14" opacity="0.85"/>
      <text x="0" y="36" fill="#39ff14" font-size="14">satya@no17:~$</text>
      <rect class="cursor prompt-caret" x="128" y="23" width="9" height="16" rx="1"/>
    </g>

    <rect x="18" y="52" width="884" height="450" fill="url(#scanlines)" opacity="0.55" pointer-events="none"/>
    <rect class="scan-beam" x="18" y="52" width="884" height="42" fill="#39ff14" opacity="0.05" pointer-events="none"/>
  </g>

  <text x="460" y="508" text-anchor="middle" fill="#3d4a5c" font-size="10" letter-spacing="2">PRESS ANY KEY TO CONTINUE_</text>
</svg>
